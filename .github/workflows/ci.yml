name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - run: php -l certant-knowledgebase.php

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-progress
      - run: vendor/bin/phpcs

  wordpress:
    name: Installs on WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wordpress: ["6.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - run: tests/smoke.sh "${{ matrix.wordpress }}"
